<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Học Từ Vựng Mỗi Ngày</title>
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Giao diện Thẻ */
        .card-container { width: 100%; max-width: 350px; height: 250px; perspective: 1000px; margin-top: 20px; }
        .card { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .card.flipped { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 20px; box-sizing: border-box; text-align: center; }
        .front { background: white; color: var(--primary); font-size: 1.8rem; font-weight: bold; border: 2px solid var(--primary); }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); font-size: 1.4rem; }

        /* Điều khiển */
        .controls { display: flex; gap: 15px; margin-top: 30px; width: 100%; max-width: 350px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: active 0.1s; }
        .btn-nav { background: #e2e8f0; color: var(--text); }
        .btn-nav:active { background: #cbd5e1; }
        
        /* Form thêm từ */
        .add-form { margin-top: 40px; width: 100%; max-width: 350px; background: white; padding: 15px; border-radius: 15px; }
        input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; /* Chống zoom trên iPhone */ }
        .btn-add { background: #10b981; color: white; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <h3 style="color: #475569;">My Flashcards</h3>
    
    <div class="card-container" onclick="document.getElementById('card').classList.toggle('flipped')">
        <div class="card" id="card">
            <div class="front" id="wordDisplay">Bấm để bắt đầu</div>
            <div class="back" id="meaningDisplay">Chào mừng bạn!</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-nav" onclick="prev()">Trước</button>
        <button class="btn-nav" onclick="next()">Sau</button>
    </div>

    <div class="add-form">
        <input type="text" id="newWord" placeholder="Từ mới (VD: Hello)">
        <input type="text" id="newMeaning" placeholder="Nghĩa (VD: Xin chào)">
        <button class="btn-add" onclick="addNewWord()">Thêm vào danh sách</button>
        <button onclick="clearData()" style="background: none; color: #ef4444; font-size: 0.8rem; margin-top: 10px;">Xóa tất cả dữ liệu</button>
    </div>

    <script>
        let vocabList = JSON.parse(localStorage.getItem('myVocab')) || [
            {w: "Hello", m: "Xin chào"},
            {w: "Apple", m: "Quả táo"}
        ];
        let index = 0;

        function render() {
            if(vocabList.length === 0) {
                document.getElementById('wordDisplay').innerText = "Trống";
                document.getElementById('meaningDisplay').innerText = "Hãy thêm từ mới!";
                return;
            }
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('wordDisplay').innerText = vocabList[index].w;
                document.getElementById('meaningDisplay').innerText = vocabList[index].m;
            }, 100);
        }

        function next() { index = (index + 1) % vocabList.length; render(); }
        function prev() { index = (index - 1 + vocabList.length) % vocabList.length; render(); }

        function addNewWord() {
            const w = document.getElementById('newWord').value;
            const m = document.getElementById('newMeaning').value;
            if(w && m) {
                vocabList.push({w, m});
                localStorage.setItem('myVocab', JSON.stringify(vocabList));
                document.getElementById('newWord').value = '';
                document.getElementById('newMeaning').value = '';
                alert("Đã thêm thành công!");
                render();
            }
        }

        function clearData() {
            if(confirm("Xóa hết từ vựng đã lưu?")) {
                localStorage.removeItem('myVocab');
                location.reload();
            }
        }

        render();
    </script>
</body>
</html>
